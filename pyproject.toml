[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "corn-forecast"
version = "0.1.0"
description = "CORN ETF one-week direction forecasting MVP with price, weather, and USDA text features."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "beautifulsoup4>=4.12",
  "matplotlib>=3.7",
  "numpy>=1.24",
  "pandas>=2.0",
  "pyarrow>=14",
  "requests>=2.31",
  "scikit-learn>=1.3",
  "yfinance>=0.2",
]

[project.optional-dependencies]
dev = [
  "doit>=0.36",
  "py>=1.11",
  "pytest>=8",
]
docs = [
  "chartbook[all]>=0.0.21; python_version >= '3.10'",
  "nbconvert>=7.16",
  "nbformat>=5.10",
]

[project.scripts]
corn-forecast = "cli:main"

[tool.setuptools]
py-modules = [
  "cli",
  "config",
  "expected_return_strategy",
  "features",
  "modeling",
  "models",
  "paths",
  "price_target_tests",
  "reports",
  "storage",
  "strategy",
  "threshold_selection",
  "validation",
  "volatility",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["data*", "scripts*", "text*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/tests"]
