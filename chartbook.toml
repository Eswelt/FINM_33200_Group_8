[config]
type = "pipeline"
chartbook_format_version = "0.0.6"

[site]
title = "CORN ETF Trading Signal Pipeline"
author = "FINM 33200 Group 8"
copyright = "2026, FINM 33200 Group 8"

[pipeline]
id = "CORN"
pipeline_name = "CORN ETF Trading Signal Pipeline"
pipeline_description = "Weekly CORN ETF trading-signal research pipeline with price, calendar, weather, text, and AI feature hooks."
lead_pipeline_developer = "FINM 33200 Group 8"
contributors = ["FINM 33200 Group 8"]
runs_on_grid_or_windows_or_other = "MacOS/Linux/Windows"
git_repo_URL = "local"
README_file_path = "./README.md"

[dataframes]

[dataframes.feature_panel]
dataframe_name = "Weekly Feature Panel"
short_description_df = "Point-in-time weekly modeling panel with price, calendar, optional weather/text/AI features, and next-week targets."
data_sources = ["Yahoo Finance", "USDA ESMIS", "Optional teammate feature tables"]
data_providers = ["yfinance", "USDA", "FINM 33200 Group 8"]
topic_tags = ["CORN", "ETF", "Trading Signal", "Weekly Forecast"]
data_frequency = "Weekly"
observation_period = "Friday close"
how_is_pulled = "Built by corn_forecast.cli build-features through pydoit."
path_to_parquet_data = "./data/processed/feature_panel.parquet"
date_col = "week"
dataframe_docs_path = "./docs_src/project_workflow.md"

[dataframes.price_target_predictions]
dataframe_name = "Fixed Threshold Classification Predictions"
short_description_df = "Walk-forward predictions for the fixed 2 percent three-class return target."
data_sources = ["Generated model output"]
data_providers = ["corn_forecast.price_target_tests"]
topic_tags = ["Classification", "Walk Forward", "CORN"]
data_frequency = "Weekly"
observation_period = "Out-of-sample weeks"
how_is_pulled = "Generated by doit classify_move."
path_to_parquet_data = "./reports/price_target_predictions.csv"
date_col = "week"
dataframe_docs_path = "./docs_src/project_workflow.md"

[dataframes.expected_return_predictions]
dataframe_name = "Expected Return Strategy Predictions"
short_description_df = "Walk-forward expected-return forecasts with trading positions and strategy returns."
data_sources = ["Generated model output"]
data_providers = ["corn_forecast.expected_return_strategy"]
topic_tags = ["Expected Return", "Strategy", "CORN"]
data_frequency = "Weekly"
observation_period = "Out-of-sample weeks"
how_is_pulled = "Generated by doit return_strategy."
path_to_parquet_data = "./reports/expected_return_predictions.csv"
date_col = "week"
dataframe_docs_path = "./docs_src/project_workflow.md"

[notes]

[notes.workflow]
path_to_markdown_file = "./docs_src/project_workflow.md"

[notes.final_report]
path_to_markdown_file = "./docs_src/final_report.md"

[notes.data_glimpses]
path_to_markdown_file = "./docs_src/data_glimpses.md"

[notebooks]

[notebooks.workflow_report]
notebook_name = "CORN Forecast Workflow Report"
notebook_description = "Generated notebook summarizing workflow, current artifacts, metrics, and figures."
notebook_path = "./reports/notebooks/corn_forecast_workflow.ipynb"
