[config]
type = "pipeline"
chartbook_format_version = "0.0.6"

[site]
title = "CORN ETF Volatility Forecasting Pipeline"
author = "FINM 33200 Group 8"
copyright = "2026, FINM 33200 Group 8"

[pipeline]
id = "CORN"
pipeline_name = "CORN ETF Volatility Forecasting Pipeline"
pipeline_description = "Weekly CORN ETF volatility forecasting pipeline with price, crop-season calendar, USDA/GLM, and GDELT feature blocks."
lead_pipeline_developer = "FINM 33200 Group 8"
contributors = ["FINM 33200 Group 8"]
runs_on_grid_or_windows_or_other = "MacOS/Linux/Windows"
git_repo_URL = "local"
README_file_path = "./README.md"

[dataframes]

[dataframes.feature_panel]
dataframe_name = "Weekly Feature Panel"
short_description_df = "Point-in-time weekly modeling panel with price, crop-season calendar, USDA/GLM, GDELT, and forward volatility targets."
data_sources = ["Yahoo Finance", "USDA ESMIS", "GDELT"]
data_providers = ["yfinance", "USDA", "GDELT", "FINM 33200 Group 8"]
topic_tags = ["CORN", "ETF", "Trading Signal", "Weekly Forecast"]
data_frequency = "Weekly"
observation_period = "Friday close"
how_is_pulled = "Built by corn_forecast.cli build-features through pydoit."
path_to_parquet_data = "./data/processed/feature_panel.parquet"
date_col = "week"
dataframe_docs_path = "./docs_src/project_workflow.md"

[dataframes.price_target_predictions]
dataframe_name = "Fixed Threshold Classification Predictions"
short_description_df = "Walk-forward predictions for the fixed 2 percent three-class return target."
data_sources = ["Generated model output"]
data_providers = ["corn_forecast.price_target_tests"]
topic_tags = ["Classification", "Walk Forward", "CORN"]
data_frequency = "Weekly"
observation_period = "Out-of-sample weeks"
how_is_pulled = "Generated by doit classify_move."
path_to_parquet_data = "./reports/price_target_predictions.csv"
date_col = "week"
dataframe_docs_path = "./docs_src/project_workflow.md"

[dataframes.expected_return_predictions]
dataframe_name = "Expected Return Strategy Predictions"
short_description_df = "Walk-forward expected-return forecasts with trading positions and strategy returns."
data_sources = ["Generated model output"]
data_providers = ["corn_forecast.expected_return_strategy"]
topic_tags = ["Expected Return", "Strategy", "CORN"]
data_frequency = "Weekly"
observation_period = "Out-of-sample weeks"
how_is_pulled = "Generated by doit return_strategy."
path_to_parquet_data = "./reports/expected_return_predictions.csv"
date_col = "week"
dataframe_docs_path = "./docs_src/project_workflow.md"

[dataframes.volatility_predictions]
dataframe_name = "Volatility Forecast Predictions"
short_description_df = "Walk-forward predictions for next-horizon realized volatility and high-volatility regime flags."
data_sources = ["Generated model output"]
data_providers = ["corn_forecast.volatility"]
topic_tags = ["Volatility", "Risk", "CORN", "Walk Forward"]
data_frequency = "Weekly"
observation_period = "Out-of-sample weeks"
how_is_pulled = "Generated by corn_forecast.cli volatility."
path_to_parquet_data = "./reports/volatility_predictions.csv"
date_col = "week"
dataframe_docs_path = "./experiments/volatility_pipeline_results.md"

[dataframes.horizon_robustness_metrics]
dataframe_name = "Horizon Robustness Metrics"
short_description_df = "Metrics for 1-week, 4-week, and 13-week direction, expected-return, and volatility experiments."
data_sources = ["Generated model output"]
data_providers = ["scripts/run_horizon_robustness.py"]
topic_tags = ["Horizon Robustness", "Volatility", "Direction", "Expected Return"]
data_frequency = "Weekly prediction cadence"
observation_period = "Out-of-sample weeks"
how_is_pulled = "Generated by scripts/run_horizon_robustness.py."
path_to_parquet_data = "./reports/horizon_robustness_metrics.csv"
dataframe_docs_path = "./experiments/horizon_robustness_results.md"

[dataframes.horizon_robustness_predictions]
dataframe_name = "Horizon Robustness Predictions"
short_description_df = "Stacked predictions from 1-week, 4-week, and 13-week horizon robustness runs."
data_sources = ["Generated model output"]
data_providers = ["scripts/run_horizon_robustness.py"]
topic_tags = ["Horizon Robustness", "Predictions", "CORN"]
data_frequency = "Weekly prediction cadence"
observation_period = "Out-of-sample weeks"
how_is_pulled = "Generated by scripts/run_horizon_robustness.py."
path_to_parquet_data = "./reports/horizon_robustness_predictions.csv"
date_col = "week"
dataframe_docs_path = "./experiments/horizon_robustness_results.md"

[dataframes.gdelt_weekly_scores]
dataframe_name = "GDELT Weekly News Scores"
short_description_df = "Weekly GDELT-derived corn market news scores integrated into the current model panel."
data_sources = ["GDELT"]
data_providers = ["FINM 33200 Group 8"]
topic_tags = ["GDELT", "News", "CORN", "Integrated Feature Block"]
data_frequency = "Weekly"
observation_period = "Weekly aggregation"
how_is_pulled = "Prepared by the project feature pipeline and staged under data/interim."
path_to_parquet_data = "./data/interim/gdelt_weekly_scores.parquet"
date_col = "week"
dataframe_docs_path = "./docs_src/final_report.md"

[notes]

[notes.workflow]
path_to_markdown_file = "./docs_src/project_workflow.md"

[notes.final_report]
path_to_markdown_file = "./docs_src/final_report.md"

[notes.data_glimpses]
path_to_markdown_file = "./docs_src/data_glimpses.md"

[notes.three_input_results]
path_to_markdown_file = "./experiments/three_input_pipeline_results.md"

[notes.price_ai_ablation]
path_to_markdown_file = "./experiments/price_ai_ablation_results.md"

[notes.gdelt_integration]
path_to_markdown_file = "./experiments/gdelt_integration_results.md"

[notes.seasonality_volatility_benchmark]
path_to_markdown_file = "./experiments/seasonality_volatility_benchmark.md"

[notes.volatility_results]
path_to_markdown_file = "./experiments/volatility_pipeline_results.md"

[notes.horizon_robustness]
path_to_markdown_file = "./experiments/horizon_robustness_results.md"

[notebooks]

[notebooks.workflow_report]
notebook_name = "CORN Forecast Workflow Report"
notebook_description = "Generated notebook summarizing workflow, current artifacts, metrics, and figures."
notebook_path = "./reports/notebooks/corn_forecast_workflow.ipynb"
