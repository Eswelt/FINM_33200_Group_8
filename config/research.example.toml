# CORN ETF forecasting research defaults.
# This file documents the intended quant workflow; the CLI exposes the same
# knobs so teammates can run experiments without changing source code.

[target]
# The main target is a fixed-band next-week arithmetic return class.
# The panel stores log returns, so fixed_return_threshold is converted to log bounds.
symbol = "CORN"
horizon_weeks = 1
classification_target = "target_return_3class"
return_target = "target_log_return_next"
fixed_return_threshold = 0.02

[validation]
# Expanding walk-forward validation approximates how a strategy would have
# been retrained through time. The first out-of-sample fold starts after
# split_date; each fold tests one quarter and then retrains.
split_date = "2022-12-31"
test_window_weeks = 13
retrain_step_weeks = 13

[models]
# Logistic regression remains the sanity-check baseline.
# Gradient boosting is the main tabular model for price + weather + text features.
baseline = "logit"
main = "hgb"

[strategy]
# Long/flat by default. Enable shorts only after checking borrow/ETF constraints.
long_threshold = 0.55
short_threshold = 0.45
allow_short = false
transaction_cost_bps = 5.0

[weather]
# North, west, south, east bounds around the US Corn Belt.
corn_belt_bbox = [49.0, -104.0, 37.0, -80.0]
history_source = "ERA5 daily statistics"
forecast_sources = ["CFSv2", "GEFSv12"]
